<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer – BacPrep</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3a;
      --accent: #f0b429;
      --text: #e8e8f0;
      --text-muted: #7a7a9a;
      --radius: 14px;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── LAYOUT ── */
    .layout {
      display: grid;
      grid-template-rows: 60px 1fr;
      height: 100vh;
    }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-btn:hover { color: var(--accent); }
    .back-btn svg { width: 16px; height: 16px; }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .doc-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .topbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      font-size: 1rem;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: #0a0a0f;
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .page-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 70px;
      text-align: center;
    }
    .page-info span { color: var(--text); font-weight: 600; }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 8px;
    }
    .zoom-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 38px;
      text-align: center;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 7px 16px;
      border-radius: 100px;
      text-decoration: none;
      transition: transform var(--transition), box-shadow var(--transition);
      white-space: nowrap;
    }
    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(240,180,41,0.35);
    }
    .download-btn svg { width: 14px; height: 14px; }

    /* ── VIEWER AREA ── */
    .viewer-area {
      overflow-y: auto;
      overflow-x: hidden;
      background: #1a1a22;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      gap: 16px;
    }

    .viewer-area::-webkit-scrollbar { width: 6px; }
    .viewer-area::-webkit-scrollbar-track { background: transparent; }
    .viewer-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .viewer-area::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .page-wrapper {
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      border-radius: 4px;
      overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }

    canvas { display: block; }

    /* ── LOADING / ERROR ── */
    .loading-screen, .error-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #1a1a22;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .error-icon { font-size: 3rem; }
    .error-title {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e05c5c;
    }
    .error-msg {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .zoom-group { display: none; }
      .doc-title { max-width: 120px; }
      .download-btn span { display: none; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Înapoi
      </a>
      <div class="divider"></div>
      <div class="doc-title" id="doc-title">Se încarcă...</div>
    </div>

    <div class="topbar-center">
      <button class="nav-btn" id="prev-btn" disabled title="Pagina anterioară">‹</button>
      <div class="page-info"><span id="page-current">1</span> / <span id="page-total">?</span></div>
      <button class="nav-btn" id="next-btn" disabled title="Pagina următoare">›</button>

      <div class="zoom-group">
        <button class="nav-btn" id="zoom-out-btn" title="Micșorează">−</button>
        <div class="zoom-label" id="zoom-label">100%</div>
        <button class="nav-btn" id="zoom-in-btn" title="Mărește">+</button>
      </div>
    </div>

    <div class="topbar-right">
      <a class="download-btn" id="download-btn" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Descarcă</span>
      </a>
    </div>
  </div>

  <!-- VIEWER -->
  <div class="viewer-area" id="viewer-area">
    <div class="loading-screen" id="loading-screen">
      <div class="spinner"></div>
      <div class="loading-text">Se încarcă documentul...</div>
    </div>
    <div class="error-screen" id="error-screen" style="display:none">
      <div class="error-icon">📄</div>
      <div class="error-title">Nu s-a putut încărca</div>
      <div class="error-msg">Fișierul PDF nu a fost găsit sau nu poate fi afișat. Încearcă să îl descarci direct.</div>
    </div>
  </div>

</div>

<script>
  // ── Config PDF.js ──
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── Citește parametrii din URL ──
  const params   = new URLSearchParams(window.location.search);
  const fileUrl  = params.get('file');
  const titlu    = params.get('titlu') || 'Document';

  document.getElementById('doc-title').textContent = titlu;
  document.title = titlu + ' – BacPrep';

  const downloadBtn = document.getElementById('download-btn');
  if (fileUrl) {
    downloadBtn.href = fileUrl;
    downloadBtn.setAttribute('download', titlu + '.pdf');
  }

  // ── State ──
  let pdfDoc    = null;
  let pageNum   = 1;
  let totalPages = 0;
  let scale     = 1.4;
  let rendering = false;

  const viewerArea  = document.getElementById('viewer-area');
  const loadingScreen = document.getElementById('loading-screen');
  const errorScreen = document.getElementById('error-screen');
  const prevBtn     = document.getElementById('prev-btn');
  const nextBtn     = document.getElementById('next-btn');
  const pageCurrentEl = document.getElementById('page-current');
  const pageTotalEl   = document.getElementById('page-total');
  const zoomLabel   = document.getElementById('zoom-label');

  // ── Randează o pagină ──
  async function renderPage(num) {
    if (rendering) return;
    rendering = true;

    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale });

    // Creează sau refolosește wrapper + canvas
    let wrapper = document.getElementById('page-canvas-wrapper');
    if (!wrapper) {
      wrapper = document.createElement('div');
      wrapper.id = 'page-canvas-wrapper';
      wrapper.className = 'page-wrapper';
      viewerArea.appendChild(wrapper);
    }

    let canvas = wrapper.querySelector('canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      wrapper.appendChild(canvas);
    }

    const ctx = canvas.getContext('2d');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    pageCurrentEl.textContent = num;
    prevBtn.disabled = num <= 1;
    nextBtn.disabled = num >= totalPages;
    rendering = false;
  }

  // ── Randează toate paginile (scroll mode) ──
  async function renderAllPages() {
    loadingScreen.style.display = 'none';

    // Curăță paginile vechi
    viewerArea.querySelectorAll('.page-wrapper').forEach(el => el.remove());

    for (let i = 1; i <= totalPages; i++) {
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({ scale });

      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper';
      wrapper.dataset.page = i;

      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      wrapper.appendChild(canvas);
      viewerArea.appendChild(wrapper);

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    // Update UI
    pageCurrentEl.textContent = 1;
    pageTotalEl.textContent   = totalPages;
    prevBtn.disabled = false;
    nextBtn.disabled = false;
  }

  // ── Scroll tracker – actualizează pagina curentă ──
  viewerArea.addEventListener('scroll', () => {
    const wrappers = viewerArea.querySelectorAll('.page-wrapper');
    wrappers.forEach(w => {
      const rect = w.getBoundingClientRect();
      const areaRect = viewerArea.getBoundingClientRect();
      if (rect.top <= areaRect.top + areaRect.height / 2 &&
          rect.bottom >= areaRect.top + areaRect.height / 2) {
        pageCurrentEl.textContent = w.dataset.page;
      }
    });
  });

  // ── Navigare butoane (scroll to page) ──
  function scrollToPage(num) {
    const wrapper = viewerArea.querySelector(`.page-wrapper[data-page="${num}"]`);
    if (wrapper) wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  prevBtn.addEventListener('click', () => {
    const cur = parseInt(pageCurrentEl.textContent);
    if (cur > 1) scrollToPage(cur - 1);
  });

  nextBtn.addEventListener('click', () => {
    const cur = parseInt(pageCurrentEl.textContent);
    if (cur < totalPages) scrollToPage(cur + 1);
  });

  // ── Zoom ──
  document.getElementById('zoom-in-btn').addEventListener('click', () => {
    if (scale >= 2.5) return;
    scale = Math.min(scale + 0.2, 2.5);
    zoomLabel.textContent = Math.round(scale / 1.4 * 100) + '%';
    if (pdfDoc) renderAllPages();
  });

  document.getElementById('zoom-out-btn').addEventListener('click', () => {
    if (scale <= 0.6) return;
    scale = Math.max(scale - 0.2, 0.6);
    zoomLabel.textContent = Math.round(scale / 1.4 * 100) + '%';
    if (pdfDoc) renderAllPages();
  });

  // ── Încarcă PDF ──
  async function loadPDF(url) {
    try {
      const loadingTask = pdfjsLib.getDocument(url);
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      pageTotalEl.textContent = totalPages;
      await renderAllPages();
    } catch (err) {
      console.error(err);
      loadingScreen.style.display = 'none';
      errorScreen.style.display   = 'flex';
    }
  }

  if (fileUrl) {
    loadPDF(fileUrl);
  } else {
    loadingScreen.style.display = 'none';
    errorScreen.style.display   = 'flex';
  }
</script>

</body>
</html>
